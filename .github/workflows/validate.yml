name: Validate poker bot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Full HTTP matches
        run: python benchmark.py --deals 1000 --seeds ci-holdout-61117 --opponents random calling_station always_half always_pot reference_agent.py adversary:nit adversary:range-tight adversary:bluffer adversary:switcher adversary:incumbent adversary:opportunist
      - name: Verify judge fault counters
        run: python tools/check_results.py benchmark-results
      - name: Fresh servers between duplicate halves
        run: python tools/fresh_match.py --opponent adversary:incumbent --seed ci-fresh-iteration2
      - name: Verify fresh-process fault counters
        run: python tools/check_results.py fresh-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-reports
          path: |
            benchmark-results/
            fresh-results/
  organizer-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact organizer build, image size and restricted smoke test
        run: bash tools/check_build.sh
